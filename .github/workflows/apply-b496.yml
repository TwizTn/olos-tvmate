name: Apply b496 PiP sync patch

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_b496.py
      - .github/b496-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python scripts/apply_b496.py
      - name: Verify complete release
        run: |
          python -m py_compile tvmate.py
          python scripts/verify_release.py
          python tvmate.py --self-test
      - name: Publish code commit before manifest commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvmate.py
          git commit -m "Synchronize native Live TV PiP state (b496)"
          git add version.txt
          git commit -m "Publish verified b496 release manifest"
      - name: Remove one-time release helpers
        run: |
          git rm scripts/apply_b496.py .github/b496-trigger .github/workflows/apply-b496.yml
          git commit -m "Remove b496 release helpers"
          git push origin HEAD:${{ github.head_ref }}
