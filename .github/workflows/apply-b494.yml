name: Compute b494 checksum

on:
  push:
    branches: [main]
    paths:
      - scripts/hash_b494_trigger.txt

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print normalized release checksum
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          raw = Path('tvmate.py').read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          text = raw.decode('utf-8')
          m = re.search(r'^VERSION\s*=\s*["\']([^"\']+)["\']', text, re.M)
          print('VERSION=' + (m.group(1) if m else 'MISSING'))
          print('SHA256=' + hashlib.sha256(raw).hexdigest())
          print('SIZE=' + str(len(raw)))
          PY
