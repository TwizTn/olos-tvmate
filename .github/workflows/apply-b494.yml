name: Apply b494 PiP patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_b494.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python scripts/apply_b494.py
      - name: Compile
        run: python -m py_compile tvmate.py
      - name: Self-test
        run: python tvmate.py --self-test
      - name: Commit code only
        run: |
          if git diff --quiet -- tvmate.py; then
            echo "No tvmate.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvmate.py
          git commit -m "Keep Live TV in Picture-in-Picture across channel changes (b494)"
          git push origin HEAD:main
