name: Apply b499 PiP icon patch

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_b499.py
      - .github/workflows/apply-b499.yml
      - .github/b499-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'b499-pip-icon' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b499-pip-icon
          fetch-depth: 0
      - name: Apply guarded patch
        run: python scripts/apply_b499.py
      - name: Verify release
        run: |
          python -m py_compile tvmate.py
          python scripts/verify_release.py
          python tvmate.py --self-test
          test "$(wc -c < tvmate.py)" -ge 500000
          grep -Fx "0.777.b499" version.txt
          grep -Fx "9fd25b01e399fffb26055cb07eb310b913ec6173d36f0c04a524dbfd2f59f999" version.txt
      - name: Publish code before manifest and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvmate.py
          git commit -m "Use distinct PiP icon in Live TV player (b499)"
          git add version.txt
          git commit -m "Publish b499 release manifest"
          git rm scripts/apply_b499.py .github/workflows/apply-b499.yml .github/b499-trigger
          git commit -m "Clean b499 release helpers"
          git push origin HEAD:b499-pip-icon
