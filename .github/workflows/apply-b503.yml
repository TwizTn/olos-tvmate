name: Apply b503 guarded release
on:
  push:
    branches: [release/b503-unified-player-team-page]
    paths:
      - trigger_b503.txt
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/b503-unified-player-team-page
          fetch-depth: 0
      - name: Apply and validate complete application
        shell: bash
        run: |
          set -euo pipefail
          git apply release_b503.patch
          test "$(wc -c < tvmate.py)" -ge 500000
          test "$(python - <<'PY'
          import hashlib, pathlib
          raw=pathlib.Path('tvmate.py').read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
          print(hashlib.sha256(raw).hexdigest())
          PY
          )" = "6ceba8ffed5e19b70b91ebe7fa97d4d2799fe21d45740917c9dc94b6020d54a7"
          python -m py_compile tvmate.py
          python tvmate.py --self-test
      - name: Publish complete script first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tvmate.py
          git commit -m "Unify player and add dedicated team page for b503"
          git push
      - name: Publish verified manifest second
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n%s\n' '0.777.b503' '6ceba8ffed5e19b70b91ebe7fa97d4d2799fe21d45740917c9dc94b6020d54a7' > version.txt
          python scripts/verify_release.py
          git add version.txt
          git commit -m "Publish b503 release manifest"
          git push
      - name: Remove branch release helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm release_b503.patch trigger_b503.txt .github/workflows/apply-b503.yml
          git commit -m "Remove b503 branch release helpers"
          git push
