name: Apply b504 guarded release
on:
  push:
    branches: [release/b504-sports-search-layout]
    paths: [trigger_b504.txt]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/b504-sports-search-layout
          fetch-depth: 0
      - name: Apply and validate complete application
        shell: bash
        run: |
          set -euo pipefail
          git apply release_b504.patch
          test "$(wc -c < tvmate.py)" -ge 500000
          test "$(python - <<'PY'
          import hashlib, pathlib
          raw=pathlib.Path('tvmate.py').read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
          print(hashlib.sha256(raw).hexdigest())
          PY
          )" = "320d841268ea0eb4a36a9ed212bb66b0bb034e63ef89e1bc9533c3355db49e99"
          python -m py_compile tvmate.py
          python tvmate.py --self-test
      - name: Publish complete script first
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tvmate.py
          git commit -m "Rebuild Sports search layout for b504"
          git push
      - name: Publish verified manifest second
        run: |
          set -euo pipefail
          printf '%s\n%s\n' '0.777.b504' '320d841268ea0eb4a36a9ed212bb66b0bb034e63ef89e1bc9533c3355db49e99' > version.txt
          python scripts/verify_release.py
          git add version.txt
          git commit -m "Publish b504 release manifest"
          git push
      - name: Remove branch release helpers
        run: |
          set -euo pipefail
          git rm release_b504.patch trigger_b504.txt
          git commit -m "Remove b504 branch release helpers"
          git push
