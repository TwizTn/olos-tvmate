name: Apply b505 guarded release
on:
  push:
    branches: [release/b505-sports-three-column-routing]
    paths:
      - .github/workflows/apply-b505.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/b505-sports-three-column-routing
          fetch-depth: 0
      - name: Apply and validate complete application
        run: |
          set -euo pipefail
          git apply release_b505.patch
          test "$(wc -c < tvmate.py)" -ge 500000
          test "$(python - <<'PY'
          import hashlib, pathlib
          raw=pathlib.Path('tvmate.py').read_bytes().replace(b'\r\n',b'\n').replace(b'\r',b'\n')
          print(hashlib.sha256(raw).hexdigest())
          PY
          )" = "d4ac9345b5192cea2be3260a062b240065219cf1d8db9ec079d0d491ff8fe379"
          python -m py_compile tvmate.py
          python tvmate.py --self-test
      - name: Publish complete script first
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tvmate.py
          git commit -m "Refine Sports columns routing and highlights for b505"
          git push
      - name: Publish verified manifest second
        run: |
          set -euo pipefail
          printf '%s\n%s\n' '0.777.b505' 'd4ac9345b5192cea2be3260a062b240065219cf1d8db9ec079d0d491ff8fe379' > version.txt
          python scripts/verify_release.py
          git add version.txt
          git commit -m "Publish b505 release manifest"
          git push
      - name: Remove release helpers
        run: |
          set -euo pipefail
          git rm release_b505.patch .github/workflows/apply-b505.yml
          git commit -m "Remove b505 release helpers"
          git push
