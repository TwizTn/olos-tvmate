name: Apply b502 favorite fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/b502.patch
      - scripts/prepare_b502.py
      - .github/workflows/apply-b502.yml
      - .github/b502-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'b502-favorite-fixtures' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b502-favorite-fixtures
          fetch-depth: 0
      - name: Apply guarded patch
        run: |
          git apply --check scripts/b502.patch
          git apply scripts/b502.patch
          python scripts/prepare_b502.py
      - name: Verify release
        run: |
          python -m py_compile tvmate.py
          python scripts/verify_release.py
          python tvmate.py --self-test
          test "$(wc -c < tvmate.py)" -ge 500000
          grep -Fx "0.777.b502" version.txt
          grep -Fx "ba80d98fef22b05328e53b29c70ec2d9ee8e1ec5ca5b1a71449229f26e02db67" version.txt
      - name: Publish code before manifest and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvmate.py
          git commit -m "Integrate favorite fixtures into today's matches (b502)"
          git add version.txt
          git commit -m "Publish b502 release manifest"
          git rm scripts/b502.patch scripts/prepare_b502.py .github/workflows/apply-b502.yml .github/b502-trigger
          git commit -m "Clean b502 release helpers"
          git push origin HEAD:b502-favorite-fixtures
