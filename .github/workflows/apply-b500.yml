name: Apply b500 unified player controls

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/b500.patch
      - scripts/prepare_b500.py
      - .github/workflows/apply-b500.yml
      - .github/b500-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'b500-unified-player-controls' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b500-unified-player-controls
          fetch-depth: 0
      - name: Apply guarded patch
        run: |
          git apply --check scripts/b500.patch
          git apply scripts/b500.patch
          python scripts/prepare_b500.py
      - name: Verify release
        run: |
          python -m py_compile tvmate.py
          python scripts/verify_release.py
          python tvmate.py --self-test
          test "$(wc -c < tvmate.py)" -ge 500000
          grep -Fx "0.777.b500" version.txt
          grep -Fx "624ea8cf6f34ceab283a2dd6f0010d1f73cd7de5181639eee4f94b3bb243ad45" version.txt
      - name: Publish code before manifest and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvmate.py
          git commit -m "Unify native controls and PiP across desktop players (b500)"
          git add version.txt
          git commit -m "Publish b500 release manifest"
          git rm scripts/b500.patch scripts/prepare_b500.py .github/workflows/apply-b500.yml .github/b500-trigger
          git commit -m "Clean b500 release helpers"
          git push origin HEAD:b500-unified-player-controls
